<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Assembleur de personnage 2D</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="panel">
    <div id="panel-header">
      <h1 data-i18n="app.title">Assembleur de personnage 2D</h1>
      <button id="settings-btn" class="icon-btn" type="button" title="Paramètres" data-i18n-title="settings.title">⚙️</button>
    </div>

    <div id="warnings"></div>

    <div class="row">
      <label for="character-select" data-i18n="label.character">Personnage :</label>
      <select id="character-select"></select>
    </div>
    <div class="row">
      <button id="reload" data-i18n="btn.reload">Recharger</button>
      <button id="reset-angles" data-i18n="btn.resetAngles">Reset angles</button>
    </div>
    <div class="row">
      <button id="export-svg" data-i18n="btn.export">Exporter</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="show-links" /> <span data-i18n="label.showJoints">afficher les points d'attache</span></label>
    </div>
    <div class="row">
      <label for="root-select" data-i18n="label.root">Racine :</label>
      <select id="root-select"></select>
    </div>

    <div class="tab-bar">
      <button type="button" class="tab-btn active" data-tab="parts" data-i18n="tab.parts">Pièces</button>
      <button type="button" class="tab-btn" data-tab="joints" data-i18n="tab.joints">Articulations</button>
    </div>
    <div id="tab-parts" class="tab-panel">
      <ul id="part-list"></ul>
    </div>
    <div id="tab-joints" class="tab-panel" hidden>
      <div id="joint-list"></div>
    </div>
  </div>

  <div id="canvas-wrap">
    <svg id="stage" viewBox="0 0 100 80" width="800" height="640" xmlns="http://www.w3.org/2000/svg">
      <g id="content"></g>
    </svg>
  </div>

  <dialog id="settings-dialog">
    <div id="settings-content">
      <div id="settings-header">
        <h2 data-i18n="settings.title">Paramètres</h2>
        <button id="settings-close" class="icon-btn" type="button" title="Fermer" data-i18n-title="settings.close">✕</button>
      </div>
      <div class="row">
        <label for="lang-select" data-i18n="settings.language">Langue :</label>
        <select id="lang-select">
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="row">
        <label for="theme-select" data-i18n="settings.theme">Thème :</label>
        <select id="theme-select">
          <option value="light" data-i18n="settings.light">Clair</option>
          <option value="dark" data-i18n="settings.dark">Sombre</option>
        </select>
      </div>
    </div>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
