<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title data-i18n="app.title">SVG RIGGING</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="panel">
    <div id="panel-header">
      <h1 data-i18n="app.title">SVG RIGGING</h1>
      <button id="settings-btn" class="icon-btn" type="button" title="Settings" data-i18n-title="settings.title">⚙️</button>
    </div>

    <div id="warnings"></div>

    <div class="row">
      <label for="character-select" data-i18n="label.character">Character:</label>
      <select id="character-select"></select>
    </div>
    <div class="row">
      <button id="reload" data-i18n="btn.reload">Reload</button>
      <button id="reset-angles" data-i18n="btn.resetAngles">Reset angles</button>
    </div>
    <div class="row">
      <button id="export-svg" data-i18n="btn.export">Export</button>
      <button id="upload-svg" data-i18n="btn.upload">Import</button>
      <input type="file" id="upload-input" accept=".svg,image/svg+xml" hidden />
    </div>
    <div class="row">
      <label><input type="checkbox" id="show-links" /> <span data-i18n="label.showJoints">show attachment points</span></label>
    </div>
    <div class="row">
      <label for="root-select" data-i18n="label.root">Root:</label>
      <select id="root-select"></select>
    </div>

    <div class="tab-bar">
      <button type="button" class="tab-btn active" data-tab="parts" data-i18n="tab.parts">Parts</button>
      <button type="button" class="tab-btn" data-tab="joints" data-i18n="tab.joints">Joints</button>
    </div>
    <div id="tab-parts" class="tab-panel">
      <ul id="part-list"></ul>
    </div>
    <div id="tab-joints" class="tab-panel" hidden>
      <div id="joint-list"></div>
    </div>
  </div>

  <div id="panel-resizer" title="Drag to resize"></div>

  <div id="canvas-wrap">
    <div id="edit-toolbar" hidden>
      <button type="button" id="tool-moving" class="edit-tool active" title="Moving" data-i18n-title="tool.moving">✥</button>
      <button type="button" id="tool-resize" class="edit-tool" title="Resize" data-i18n-title="tool.resize">⤢</button>
      <button type="button" id="tool-rotate" class="edit-tool" title="Rotate" data-i18n-title="tool.rotate">⟳</button>
      <button type="button" id="tool-setting" class="edit-tool" title="Edit joint ids" data-i18n-title="tool.setting">⚙️</button>
    </div>
    <svg id="stage" viewBox="0 0 100 80" width="800" height="640" xmlns="http://www.w3.org/2000/svg">
      <g id="content"></g>
    </svg>
  </div>

  <dialog id="settings-dialog">
    <div id="settings-content">
      <div id="settings-header">
        <h2 data-i18n="settings.title">Settings</h2>
        <button id="settings-close" class="icon-btn" type="button" title="Close" data-i18n-title="settings.close">✕</button>
      </div>
      <div class="row">
        <label for="lang-select" data-i18n="settings.language">Language:</label>
        <select id="lang-select">
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="row">
        <label for="theme-select" data-i18n="settings.theme">Theme:</label>
        <select id="theme-select">
          <option value="light" data-i18n="settings.light">Light</option>
          <option value="dark" data-i18n="settings.dark">Dark</option>
        </select>
      </div>
    </div>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
