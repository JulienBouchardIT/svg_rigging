<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Assembleur de personnage 2D</title>
<style>
  :root {
    color-scheme: light dark;
    font-family: system-ui, sans-serif;
  }
  body {
    margin: 0;
    display: flex;
    height: 100vh;
  }
  #panel {
    width: 320px;
    padding: 16px;
    overflow-y: auto;
    border-right: 1px solid #8884;
    box-sizing: border-box;
  }
  #canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(45deg, #8882 25%, transparent 25%) -10px 0/20px 20px,
      linear-gradient(-45deg, #8882 25%, transparent 25%) -10px 0/20px 20px;
  }
  #stage {
    background: #fff2;
    border: 1px solid #8884;
  }
  h1 {
    font-size: 16px;
    margin: 0 0 12px;
  }
  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.7;
    margin: 18px 0 6px;
  }
  #part-list {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 13px;
  }
  #part-list li {
    padding: 2px 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-radius: 4px;
  }
  #part-list li.editing {
    background: #4caf5026;
  }
  #part-list li.drag-over {
    outline: 2px dashed #4caf50;
    outline-offset: -2px;
  }
  #part-list li.dragging {
    opacity: 0.4;
  }
  .drag-handle {
    cursor: grab;
    opacity: 0.6;
    padding: 0 2px;
    user-select: none;
  }
  .drag-handle:active {
    cursor: grabbing;
  }
  .icon-btn {
    background: none;
    border: 1px solid transparent;
    font-size: 14px;
    line-height: 1;
    padding: 2px 5px;
    cursor: pointer;
    border-radius: 4px;
  }
  .icon-btn:hover:not(:disabled) {
    background: #8882;
  }
  .icon-btn.off {
    opacity: 0.3;
  }
  .icon-btn.active {
    background: #4caf5033;
    border-color: #4caf50;
  }
  .icon-btn:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }
  .joint-slider:disabled {
    opacity: 0.4;
  }
  .joint {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 2px 8px;
    margin-bottom: 10px;
    font-size: 12px;
  }
  .joint label {
    grid-column: 1 / 3;
    opacity: 0.85;
  }
  .joint input[type="range"] {
    width: 100%;
  }
  .joint .joint-value {
    text-align: right;
    min-width: 3em;
  }
  #warnings {
    white-space: pre-line;
    font-size: 12px;
    background: #ffb0002a;
    border: 1px solid #ffb00066;
    border-radius: 4px;
    padding: 8px;
    margin-bottom: 12px;
    display: none;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  button {
    font-size: 12px;
    padding: 4px 8px;
    cursor: pointer;
  }
  select {
    flex: 1;
  }
  circle.link-point {
    pointer-events: none;
  }
  .edit-handle {
    cursor: grab;
  }
  .edit-handle:active {
    cursor: grabbing;
  }
</style>
</head>
<body>
  <div id="panel">
    <h1>Assembleur de personnage 2D</h1>

    <div id="warnings"></div>

    <div class="row">
      <button id="reload">Recharger</button>
      <button id="reset-angles">Reset angles</button>
    </div>
    <div class="row">
      <button id="export-svg">Exporter</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="show-links" /> afficher les points d'attache</label>
    </div>
    <div class="row">
      <label for="root-select">Racine :</label>
      <select id="root-select"></select>
    </div>

    <h2>Pièces chargées</h2>
    <ul id="part-list"></ul>

    <h2>Articulations</h2>
    <div id="joint-list"></div>
  </div>

  <div id="canvas-wrap">
    <svg id="stage" viewBox="0 0 100 80" width="800" height="640" xmlns="http://www.w3.org/2000/svg">
      <g id="content"></g>
    </svg>
  </div>

  <script src="rig.js"></script>
</body>
</html>
